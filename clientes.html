<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
     integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Clientes | Eventos Prestige</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="hola">
<header>
    <nav class="navbar">
        <div class="container-fluid">
          <a class="navbar-brand" href="index.html">Eventos Prestige</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
            <div class="offcanvas-header">
              <a class="nav-link" id="offcanvasNavbarLabel" href="index.html">Eventos Prestige</a>
              <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
              <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                <li class="nav-item"><a class="nav-link" href="index.html">Gestión de Eventos</a></li>
                <li class="nav-item"><a class="nav-link active" aria-current="page" href="clientes.html">Gestión de Clientes</a></li>
                <li class="nav-item"><a class="nav-link" href="salones.html">Gestión de Salones</a></li>
              </ul>
            </div>
          </div>
        </div>
    </nav>
</header>
</div>
<main class="container my-4">
    <div id="alertContainer"></div>
    <div class="d-flex justify-content-between align-items-center page-title">
        <h2 class="mb-0">Listado de Clientes</h2>
        <button id="btnNuevoCliente" class="btn btn-prestige">+ Nuevo cliente</button>
    </div>
    <div class="table-responsive">
    <table class="table table-hover align-middle">
        <thead>
            <tr><th>#</th><th>Nombre</th><th>Apellido</th><th>Teléfono</th><th>Email</th><th>Dirección</th><th>Acciones</th></tr>
        </thead>
        <tbody id="clientesBody"></tbody>
    </table>
    </div>

    <div class="modal fade" id="clienteModal" tabindex="-1" aria-labelledby="clienteModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <form class="modal-content" id="clienteForm" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="clienteModalLabel">Nuevo cliente</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="clienteId">
            <div class="mb-3"><label for="nombre" class="form-label">Nombre *</label>
                <input type="text" class="form-control" id="nombre" maxlength="100">
                <div class="invalid-feedback">El nombre es obligatorio.</div></div>
            <div class="mb-3"><label for="apellido" class="form-label">Apellido *</label>
                <input type="text" class="form-control" id="apellido" maxlength="100">
                <div class="invalid-feedback">El apellido es obligatorio.</div></div>
            <div class="mb-3"><label for="telefono" class="form-label">Teléfono *</label>
                <input type="tel" class="form-control" id="telefono" maxlength="15">
                <div class="invalid-feedback">El teléfono es obligatorio.</div></div>
            <div class="mb-3"><label for="email" class="form-label">Email *</label>
                <input type="email" class="form-control" id="email" maxlength="100">
                <div class="invalid-feedback">Ingresa un email válido.</div></div>
            <div class="mb-3"><label for="direccion" class="form-label">Dirección</label>
                <input type="text" class="form-control" id="direccion" maxlength="200"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-prestige">Guardar</button>
          </div>
        </form>
      </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
     integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script type="module" src="js/controllers/clientesController.js"></script>
</body>
</html>
